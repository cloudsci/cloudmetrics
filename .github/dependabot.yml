# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # keep uv.lock fresh (python dependencies)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "quarterly"
    # only propose versions that have been released for at least 7 days
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # keep the actions used in .github/workflows up to date
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "quarterly"
    # only propose versions that have been released for at least 7 days
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # keep the hook revisions in .pre-commit-config.yaml up to date
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "quarterly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
    groups:
      pre-commit-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
