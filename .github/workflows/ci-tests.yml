name: tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: pytest on python ${{ matrix.python-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies from uv.lock
        run: uv sync --locked --extra test
      - name: Test with pytest
        run: uv run pytest
